<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World of Zuul - Game</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0b1020;
            color: #fff;
        }
        .box { text-align: center; opacity: 0.9; }
    </style>
</head>
<body>
<div class="box">
    <h1>游戏页面</h1>
    <p>登录成功，已跳转到 /game。</p>
</div>
<script>
    const token = sessionStorage.getItem('token');
    if (!token) {
        window.location.replace('/');
    }
</script>
</body>
</html>
