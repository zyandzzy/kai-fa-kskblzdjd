<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World of Zuul - Game</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .box {
            width: min(90vw, 560px);
            padding: 24px;
            border-radius: 12px;
            background: #1e293b;
        }
    </style>
</head>
<body>
<section class="box">
    <h1>已进入游戏页面</h1>
    <p>主界面开发中，当前用于验证登录跳转流程。</p>
    <p id="status">登录态校验通过。</p>
</section>
<script>
    const token = sessionStorage.getItem("token");
    if (!token) {
        window.location.href = "/";
    }
</script>
</body>
</html>
