<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World of Zuul - 登录/注册</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #fff;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #0b1020;
        }
        body::before {
            content: "";
            position: fixed;
            inset: -20%;
            background: radial-gradient(circle at 20% 20%, rgba(40, 90, 255, 0.35), transparent 45%),
                        radial-gradient(circle at 80% 30%, rgba(147, 51, 234, 0.35), transparent 45%),
                        radial-gradient(circle at 50% 80%, rgba(16, 185, 129, 0.35), transparent 45%);
            animation: pulse 10s linear infinite alternate;
            z-index: -2;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(7, 10, 24, 0.35);
            z-index: -1;
        }
        @keyframes pulse {
            from { transform: scale(1) rotate(0deg); }
            to { transform: scale(1.15) rotate(8deg); }
        }
        .panel {
            width: min(92vw, 440px);
            border-radius: 16px;
            padding: 28px;
            backdrop-filter: blur(8px);
            background: rgba(16, 23, 46, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.3);
        }
        h1 { margin: 0 0 20px; text-align: center; font-size: 30px; letter-spacing: 1px; }
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 18px;
        }
        .tab {
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 10px;
            background: transparent;
            color: #fff;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active {
            background: #4f46e5;
            border-color: #4f46e5;
        }
        .form { display: none; }
        .form.active { display: block; }
        label {
            display: block;
            margin: 10px 0 6px;
            font-size: 14px;
            opacity: 0.95;
        }
        input {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 10px 12px;
            outline: none;
        }
        input:focus { border-color: #818cf8; }
        button.submit {
            width: 100%;
            margin-top: 16px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: #fff;
            padding: 11px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }
        .error {
            min-height: 22px;
            margin-top: 8px;
            color: #fda4af;
            font-size: 13px;
        }
        .success {
            min-height: 22px;
            margin-top: 8px;
            color: #86efac;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="panel">
    <h1>World of Zuul</h1>

    <div class="tabs">
        <button id="loginTab" class="tab active" type="button">登录</button>
        <button id="registerTab" class="tab" type="button">注册</button>
    </div>

    <form id="loginForm" class="form active" novalidate>
        <label for="loginUsername">用户名</label>
        <input id="loginUsername" name="username" autocomplete="username" />

        <label for="loginPassword">密码</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" />

        <button class="submit" type="submit">登录</button>
        <div id="loginError" class="error"></div>
    </form>

    <form id="registerForm" class="form" novalidate>
        <label for="registerUsername">用户名</label>
        <input id="registerUsername" name="username" autocomplete="username" />

        <label for="registerPassword">密码</label>
        <input id="registerPassword" name="password" type="password" autocomplete="new-password" />

        <label for="confirmPassword">确认密码</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" />

        <button class="submit" type="submit">注册</button>
        <div id="registerError" class="error"></div>
        <div id="registerSuccess" class="success"></div>
    </form>
</div>

<script>
    const SWITCH_TAB_DELAY_MS = 600;
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginError = document.getElementById('loginError');
    const registerError = document.getElementById('registerError');
    const registerSuccess = document.getElementById('registerSuccess');

    function switchTab(isLogin) {
        loginTab.classList.toggle('active', isLogin);
        registerTab.classList.toggle('active', !isLogin);
        loginForm.classList.toggle('active', isLogin);
        registerForm.classList.toggle('active', !isLogin);
        loginError.textContent = '';
        registerError.textContent = '';
        registerSuccess.textContent = '';
    }

    loginTab.addEventListener('click', () => switchTab(true));
    registerTab.addEventListener('click', () => switchTab(false));

    function validate(username, password) {
        if (!username || !username.trim()) {
            return '用户名不能为空';
        }
        if (!password || password.length < 6) {
            return '密码长度至少为 6 位';
        }
        return '';
    }

    loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        loginError.textContent = '';

        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        const error = validate(username, password);
        if (error) {
            loginError.textContent = error;
            return;
        }

        try {
            const response = await fetch('/api/user/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username.trim(), password })
            });
            const result = await response.json();

            if (!response.ok || !result.success) {
                loginError.textContent = result.message || '登录失败';
                return;
            }

            if (result.data && result.data.token) {
                sessionStorage.setItem('token', result.data.token);
            }
            window.location.href = '/game';
        } catch (e) {
            loginError.textContent = '网络异常，请稍后重试';
        }
    });

    registerForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        registerError.textContent = '';
        registerSuccess.textContent = '';

        const username = document.getElementById('registerUsername').value;
        const password = document.getElementById('registerPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        const error = validate(username, password);
        if (error) {
            registerError.textContent = error;
            return;
        }
        if (password !== confirmPassword) {
            registerError.textContent = '两次密码输入不一致';
            return;
        }

        try {
            const response = await fetch('/api/user/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username.trim(), password })
            });
            const result = await response.json();

            if (!response.ok || !result.success) {
                registerError.textContent = result.message || '注册失败';
                return;
            }

            registerSuccess.textContent = '注册成功，请登录';
            registerForm.reset();
            setTimeout(() => switchTab(true), SWITCH_TAB_DELAY_MS);
        } catch (e) {
            registerError.textContent = '网络异常，请稍后重试';
        }
    });
</script>
</body>
</html>
