<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World of Zuul</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at top, #243b55, #141e30 65%);
            overflow: hidden;
        }
        body::before, body::after {
            content: "";
            position: fixed;
            width: 60vmax;
            height: 60vmax;
            border-radius: 50%;
            filter: blur(70px);
            z-index: -1;
            animation: drift 10s infinite alternate ease-in-out;
        }
        body::before { background: rgba(82, 153, 255, 0.25); top: -15vmax; left: -15vmax; }
        body::after { background: rgba(51, 255, 189, 0.15); right: -18vmax; bottom: -20vmax; animation-delay: 2s; }
        @keyframes drift { from { transform: translateY(-10px); } to { transform: translateY(10px); } }

        .panel {
            width: min(92vw, 440px);
            padding: 24px 22px;
            border-radius: 14px;
            backdrop-filter: blur(8px);
            background: rgba(15, 23, 42, 0.75);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
        }
        h1 {
            margin: 0 0 14px;
            text-align: center;
            letter-spacing: 1px;
            font-size: 28px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .tab-btn {
            flex: 1;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #bcd6ff;
            background: rgba(53, 88, 140, 0.35);
            padding: 10px 0;
            font-size: 15px;
        }
        .tab-btn.active {
            color: #fff;
            background: linear-gradient(135deg, #2b6cff, #22b7ff);
        }
        .field { margin-bottom: 12px; }
        .field label { display: block; margin-bottom: 5px; font-size: 13px; color: #c6d7ff; }
        .field input {
            width: 100%;
            border: 1px solid rgba(124, 162, 224, 0.4);
            border-radius: 8px;
            color: #fff;
            background: rgba(19, 32, 55, 0.75);
            padding: 10px 12px;
            outline: none;
        }
        .field input:focus { border-color: #67b5ff; }
        .hidden { display: none; }
        .error {
            min-height: 20px;
            margin: 2px 0 8px;
            color: #ff9fa7;
            font-size: 13px;
        }
        .ok { color: #82f8b9; }
        .action {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 10px 0;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
        }
    </style>
</head>
<body>
<main class="panel">
    <h1>World of Zuul</h1>
    <div class="tabs">
        <button id="loginTab" class="tab-btn active" type="button">登录</button>
        <button id="registerTab" class="tab-btn" type="button">注册</button>
    </div>

    <form id="loginForm">
        <div class="field">
            <label for="loginUsername">用户名</label>
            <input id="loginUsername" name="username" autocomplete="username" />
        </div>
        <div class="field">
            <label for="loginPassword">密码</label>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" />
        </div>
        <div id="loginError" class="error"></div>
        <button class="action" type="submit">登录</button>
    </form>

    <form id="registerForm" class="hidden">
        <div class="field">
            <label for="registerUsername">用户名</label>
            <input id="registerUsername" name="username" autocomplete="username" />
        </div>
        <div class="field">
            <label for="registerPassword">密码</label>
            <input id="registerPassword" name="password" type="password" autocomplete="new-password" />
        </div>
        <div class="field">
            <label for="confirmPassword">确认密码</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" />
        </div>
        <div id="registerError" class="error"></div>
        <button class="action" type="submit">注册</button>
    </form>
</main>

<script>
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const loginError = document.getElementById("loginError");
    const registerError = document.getElementById("registerError");

    function switchTab(isLogin) {
        loginTab.classList.toggle("active", isLogin);
        registerTab.classList.toggle("active", !isLogin);
        loginForm.classList.toggle("hidden", !isLogin);
        registerForm.classList.toggle("hidden", isLogin);
        loginError.textContent = "";
        registerError.textContent = "";
        registerError.classList.remove("ok");
    }

    loginTab.addEventListener("click", () => switchTab(true));
    registerTab.addEventListener("click", () => switchTab(false));

    function validate(username, password) {
        if (!username || !username.trim()) return "用户名不能为空";
        if (!password || password.length < 6) return "密码长度不能少于6位";
        return null;
    }

    loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const username = document.getElementById("loginUsername").value.trim();
        const password = document.getElementById("loginPassword").value;
        const error = validate(username, password);
        if (error) {
            loginError.textContent = error;
            return;
        }

        loginError.textContent = "";
        try {
            const response = await fetch("/api/user/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const result = await response.json();
            if (!result.success) {
                loginError.textContent = result.message || "密码错误或用户名不存在";
                return;
            }

            const token = result.data && result.data.token;
            if (!token) {
                loginError.textContent = "登录响应缺少 token";
                return;
            }
            sessionStorage.setItem("token", token);
            window.location.href = "/game";
        } catch (_) {
            loginError.textContent = "登录失败，请稍后重试";
        }
    });

    registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const username = document.getElementById("registerUsername").value.trim();
        const password = document.getElementById("registerPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        const error = validate(username, password);
        if (error) {
            registerError.textContent = error;
            registerError.classList.remove("ok");
            return;
        }
        if (password !== confirmPassword) {
            registerError.textContent = "两次输入的密码不一致";
            registerError.classList.remove("ok");
            return;
        }

        registerError.textContent = "";
        try {
            const response = await fetch("/api/user/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const result = await response.json();
            if (!result.success) {
                registerError.textContent = result.message || "用户名已存在";
                registerError.classList.remove("ok");
                return;
            }

            registerError.textContent = "注册成功，请登录";
            registerError.classList.add("ok");
            document.getElementById("loginUsername").value = username;
            document.getElementById("loginPassword").value = "";
            switchTab(true);
        } catch (_) {
            registerError.textContent = "注册失败，请稍后重试";
            registerError.classList.remove("ok");
        }
    });
</script>
</body>
</html>
